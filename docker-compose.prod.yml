services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mtg_tracker
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not exposed externally — only reachable by scraper/web on the Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg"]
      interval: 5s
      retries: 5

  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper
    restart: always
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: production
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_ENV: ${EBAY_ENV:-production}
      EBAY_PAGES_PER_SET: ${EBAY_PAGES_PER_SET:-5}
      EBAY_PAGES_PER_CARD: ${EBAY_PAGES_PER_CARD:-1}
      EBAY_RECENT_MONTHS: ${EBAY_RECENT_MONTHS:-12}
      EBAY_HIGH_VALUE_USD: ${EBAY_HIGH_VALUE_USD:-10}
    volumes:
      - scraper_data:/app/apps/scraper/data   # persists downloaded Scryfall JSON between runs
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: always
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  pgdata:
  scraper_data:
