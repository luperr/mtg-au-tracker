# Image tags: third-party images the server pulls (db, tunnel) are pinned to an exact
# version, because deploy.sh pulls every service and a floating tag would move them on
# whatever day someone happened to deploy. Bump them on purpose, after reading the
# release notes. Our own images (web, scraper) float their base's patch level instead —
# CI rebuilds them on every merge, which is how security patches get in.
services:
  db:
    # Bumping: see "Bumping a third-party image" in docs/prod-release.md.
    image: postgres:16.15-alpine3.24
    restart: always
    shm_size: 256mb
    # Postgres ran on stock defaults until now: shared_buffers=128MB against a ~20GB
    # database, on a ZFS mirror of USB-attached spinning disks (~40 IOPS). The cache
    # hit rate was 40% — six of every ten block reads went to physical disk — while
    # 5.9GB of the container's 7.6GB sat unused. Nothing here buys speed with CPU;
    # every setting is here to keep pages in RAM and off that disk.
    #
    # Budget at 7.6GB total: 2GB shared_buffers + (3 autovacuum workers x 256MB
    # maintenance_work_mem) + ~20 backends x 16MB work_mem ~= 3.1GB worst case.
    #
    # Deliberately NOT changed: random_page_cost (4 is honest for spinning disks) and
    # effective_io_concurrency (1 is right for a single mirror) — lowering either
    # would push the planner toward more random IO, which is the resource we lack.
    command: >
      postgres
      -c shared_buffers=2GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_wal_size=4GB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: mtg_tracker
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not exposed externally — only reachable by scraper/web on the backend network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg_tracker"]
      interval: 5s
      retries: 5
      # Crash recovery can replay up to max_wal_size (4GB) at ~40 IOPS. Probes that fail
      # inside this window don't count, so a slow recovery isn't marked unhealthy and
      # doesn't fail the deploy's `run ... db:migrate` on dependency health.
      start_period: 10m
    # Compose's default is 10s, then SIGKILL. The shutdown checkpoint flushes up to 2GB
    # of shared_buffers to the same disks, so 10s turns every recreate (an image bump —
    # deploy.sh pulls db now) into a crash and a WAL replay.
    stop_grace_period: 5m
    networks:
      - backend

  scraper:
    image: ${IMAGE_REGISTRY:-ghcr.io/luperr}/scrymarket-scraper:${IMAGE_TAG:-latest}
    # Without this, `up -d` silently builds when the tag can't be pulled — an hour of
    # BuildKit on the LXC instead of a loud failure. An explicit `build` still overrides.
    pull_policy: always
    build:                       # emergency fallback only — normal deploys pull, never build
      context: .
      dockerfile: docker/Dockerfile.scraper
    user: "1002:1002"
    init: true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    tmpfs:
      # Sized deliberately: the Scryfall bulk file lands here (624MB uncompressed,
      # measured 2026-08-22) and tmpfs pages count against mem_limit. Unbounded, a
      # growing upstream file would quietly eat the heap's budget instead of failing.
      - /tmp:size=1g
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: production
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_ENV: ${EBAY_ENV:-production}
      EBAY_PAGES_PER_SET: ${EBAY_PAGES_PER_SET:-5}
      EBAY_PAGES_PER_CARD: ${EBAY_PAGES_PER_CARD:-1}
      SCRAPE_CRON_SCRYFALL: ${SCRAPE_CRON_SCRYFALL:-0 3 * * *}
      SCRAPE_CRON_STORES: ${SCRAPE_CRON_STORES:-0 5 * * *}
      SCRAPE_CRON_EBAY: ${SCRAPE_CRON_EBAY:-0 6 * * *}
      SCRAPE_CRON_MARKET: ${SCRAPE_CRON_MARKET:-0 7 * * *}
      MARKET_STATS_ENABLED: ${MARKET_STATS_ENABLED:-}
      EBAY_DAILY_TARGET: ${EBAY_DAILY_TARGET:-4500}
      STORE_CONCURRENCY: ${STORE_CONCURRENCY:-3}
      CC_CONCURRENCY: ${CC_CONCURRENCY:-3}
      CC_FULL_SCAN_DAYS: ${CC_FULL_SCAN_DAYS:-7}
      MTGMATE_FULL_SCAN_DAYS: ${MTGMATE_FULL_SCAN_DAYS:-7}
      SET_CARD_DAILY_RETENTION_DAYS: ${SET_CARD_DAILY_RETENTION_DAYS:-365}
      SCRYFALL_BULK_URL: ${SCRYFALL_BULK_URL:-https://api.scryfall.com/bulk-data}
      SCRYFALL_OUTPUT_DIR: ${SCRYFALL_OUTPUT_DIR:-/tmp/mtg-scraper}
      USER_AGENT: ${USER_AGENT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Heap budget, not a wish. The 2g cgroup has to cover the Scryfall file sitting
      # in the /tmp tmpfs (624MB) plus Chromium when a store hits a bot challenge, so
      # the heap gets ~1GB of it. At the previous 4096, Node saw no reason to GC
      # before 4GB and the kernel OOM-killed it first.
      NODE_OPTIONS: --max-old-space-size=1024
    mem_limit: 2g
    memswap_limit: 2g
    # Verified: Playwright launches Chromium with --no-sandbox by default, so it needs no
    # capabilities — and this is the service parsing untrusted HTML.
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/luperr}/scrymarket-web:${IMAGE_TAG:-latest}
    # Without this, `up -d` silently builds when the tag can't be pulled — an hour of
    # BuildKit on the LXC instead of a loud failure. An explicit `build` still overrides.
    pull_policy: always
    build:                       # emergency fallback only — normal deploys pull, never build
      context: .
      dockerfile: docker/Dockerfile.web
    user: "1001:1001"
    init: true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1001,gid=1001   # Next.js image optimisation + ISR cache
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: production
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EBAY_AFFILIATE_CAMPAIGN_ID: ${EBAY_AFFILIATE_CAMPAIGN_ID:-}
      EBAY_AFFILIATE_ROTATION_ID: ${EBAY_AFFILIATE_ROTATION_ID:-}
      SEARCH_V2_DEFAULT: ${SEARCH_V2_DEFAULT:-}
    cap_drop:
      - ALL
    healthcheck:
      # busybox wget ships in node:alpine; /api/health touches no DB, so this says "Next
      # is serving", not "the database is fine" — db has its own check.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  tunnel:
    # Stay >= 2026.10.7: it fixes an http2 max-concurrent-streams regression from the
    # go1.27 build, and this tunnel runs http2. Bumping: see "Bumping a third-party
    # image" in docs/prod-release.md.
    image: cloudflare/cloudflared:2026.10.7
    restart: always
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    tmpfs:
      - /tmp
    # --protocol http2: QUIC (UDP 7844) is blocked on this network — see 6a6eab2.
    command: tunnel --no-autoupdate --protocol http2 run
    healthcheck:
      # The image is distroless — no shell, no curl — so cloudflared probes its own
      # /ready (via TUNNEL_METRICS), which is 200 only while an edge connection is up.
      # Docker does not restart unhealthy containers; this is for `ps` after a deploy.
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      # Read by both `run` and the healthcheck's `ready`. Loopback on a fixed port:
      # unset, cloudflared binds 0.0.0.0 on the first free port in 20241-20245, which
      # puts /metrics and /debug on the frontend network.
      TUNNEL_METRICS: 127.0.0.1:20241
      # 2026.4.0 changed the default from 4 to `auto` (whichever family the resolver
      # returns first). Held at 4 so the upgrade doesn't also change how the LXC
      # reaches the edge; drop this once IPv6 egress from the LXC is known to work.
      TUNNEL_EDGE_IP_VERSION: "4"
    # service_started, not service_healthy: the first web probe lands 30s after start,
    # so waiting on it would hold the tunnel down that long on every deploy (and abort
    # `up -d` if web were slow). cloudflared retries the origin on its own.
    depends_on:
      web:
        condition: service_started
    networks:
      - frontend

networks:
  frontend:   # tunnel ↔ web
  backend:    # web + scraper ↔ db

volumes:
  pgdata:
  # scraper_data is gone: it held the probe-cache JSON (now the scraper_cache table)
  # and, before that, the Scryfall download. The volume still exists on the prod host
  # with a stale 528MB default_cards.json from March — reclaim with
  # `docker volume rm mtg-au-tracker_scraper_data` once this is deployed.
