services:
  db:
    image: postgres:16-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: mtg_tracker
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not exposed externally — only reachable by scraper/web on the backend network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg_tracker"]
      interval: 5s
      retries: 5
    networks:
      - backend

  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper
    user: "1002:1002"
    init: true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    tmpfs:
      - /tmp
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: production
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_ENV: ${EBAY_ENV:-production}
      EBAY_PAGES_PER_SET: ${EBAY_PAGES_PER_SET:-5}
      EBAY_PAGES_PER_CARD: ${EBAY_PAGES_PER_CARD:-1}
      EBAY_RECENT_MONTHS: ${EBAY_RECENT_MONTHS:-12}
      EBAY_HIGH_VALUE_USD: ${EBAY_HIGH_VALUE_USD:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - scraper_data:/app/apps/scraper/data   # persists downloaded Scryfall JSON between runs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    user: "1001:1001"
    init: true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1001,gid=1001   # Next.js image optimisation + ISR cache
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: production
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    tmpfs:
      - /tmp
    command: tunnel --no-autoupdate --protocol http2 run
    security_opt:
      - no-new-privileges:true
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_started
    networks:
      - frontend

networks:
  frontend:   # tunnel ↔ web
  backend:    # web + scraper ↔ db

volumes:
  pgdata:
  scraper_data:
