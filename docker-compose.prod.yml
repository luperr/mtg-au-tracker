services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: mtg_tracker
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not exposed externally — only reachable by scraper/web on the backend network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg_tracker"]
      interval: 5s
      retries: 5
    networks:
      - backend

  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper
    user: "1002:1002"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: production
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_ENV: ${EBAY_ENV:-production}
      EBAY_PAGES_PER_SET: ${EBAY_PAGES_PER_SET:-5}
      EBAY_PAGES_PER_CARD: ${EBAY_PAGES_PER_CARD:-1}
      EBAY_RECENT_MONTHS: ${EBAY_RECENT_MONTHS:-12}
      EBAY_HIGH_VALUE_USD: ${EBAY_HIGH_VALUE_USD:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - scraper_data:/app/apps/scraper/data   # persists downloaded Scryfall JSON between runs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    user: "1001:1001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache   # Next.js image optimisation + ISR cache
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: production
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    command: tunnel --no-autoupdate --protocol http2 run
    security_opt:
      - no-new-privileges:true
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_started
    networks:
      - frontend

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    # Runs as root — required to read /var/lib/docker/containers (root:root 710)
    # and the Docker socket. No safe non-root UID exists for log shipping.
    read_only: true
    tmpfs:
      - /tmp    # promtail writes positions file here (positions.yaml)
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "10.10.20.10:8080:8080"   # only reachable from services VLAN — Prometheus at 10.10.30.10 scrapes via inter-VLAN routing

networks:
  frontend:   # tunnel ↔ web
  backend:    # web + scraper ↔ db

volumes:
  pgdata:
  scraper_data:
