name: Changelog

# Flags in commit messages drive the /changelog page. Each must start its line, lowercase:
#   changelog: "Added Example Games."   → an entry, added on merge
#   no-changelog                        → no entry
# The quotes are required: an unquoted `changelog: ...` line is ordinary commit prose.
#
# check — on every PR, fails unless some commit carries a flag or entries.json was edited.
# apply — on push to main, joins the flags into one entry, commits it, and re-dispatches
#         deploy-images.yml so it ships now. That dispatch is explicit because a push made
#         with GITHUB_TOKEN deliberately triggers no other workflow; deploy-images queues
#         rather than cancels, so the merge's own build still finishes first.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  ENTRIES_PATH: apps/web/src/app/changelog/entries.json
  # sed -nE program printing the quoted text of each entry flag, and nothing else.
  FLAG: 's/^changelog:[[:space:]]*"(.*[^[:space:]].*)"[[:space:]]*$/\1/p'

jobs:
  check:
    name: Changelog flag
    # Dependabot can't write flags; a skipped job still satisfies a required check.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - env:
          BASE: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # BASE..HEAD excludes everything already on main, including commits brought in by
          # merging main into the branch.
          msgs=$(git log --format=%B "$BASE..$HEAD_SHA")
          notes=$(sed -nE "$FLAG" <<< "$msgs")

          if [ -n "$notes" ]; then
            echo "Entry on merge: $(paste -sd' ' <<< "$notes")"
          elif grep -qE '^no-changelog[[:space:]]*$' <<< "$msgs"; then
            echo "no-changelog"
          elif ! git diff --quiet "$BASE...$HEAD_SHA" -- "$ENTRIES_PATH"; then
            echo "entries.json edited directly"
          else
            echo "::error::No changelog flag. Add a line to a commit message in this PR — 'changelog: \"<sentence for users>\"' or 'no-changelog' — or edit $ENTRIES_PATH."
            exit 1
          fi

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two merges in quick succession would otherwise race to push entries.json.
    concurrency:
      group: changelog-apply
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write            # to dispatch deploy-images.yml
      pull-requests: read       # to look up the merged PR's number
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main             # a queued run can be behind main by the time it starts

      - env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          text=$(git log --format=%B "$BEFORE..$AFTER" | sed -nE "$FLAG" | paste -sd' ')
          [ -n "$text" ] || { echo "No changelog flags in this push."; exit 0; }

          # A re-run for a push already applied.
          if jq -e --arg text "$text" 'any(.[]; .text == $text)' "$ENTRIES_PATH" > /dev/null; then
            echo "Entry already present."; exit 0
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$AFTER/pulls" --jq '.[0].number // empty' || true)
          # The site's audience is in Australia; a UTC date would be a day early for morning merges.
          date=$(TZ=Australia/Sydney date +%F)

          jq --arg date "$date" --arg text "$text" --arg pr "$pr" \
            '[{date: $date, text: $text} + (if $pr == "" then {} else {pr: ($pr | tonumber)} end)] + .' \
            "$ENTRIES_PATH" > entries.tmp && mv entries.tmp "$ENTRIES_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ENTRIES_PATH"
          git commit -m "chore(changelog): add entry${pr:+ for #$pr}"
          git push

          gh workflow run deploy-images.yml --ref main
