name: Changelog

# Commit-message flags drive the /changelog page — the format is documented in CLAUDE.md
# ("Changelog flags"). The check runs on each PR and, when it finds an entry flag, commits the
# entry to entries.json on the PR branch itself, so it ships with the merge. main is protected,
# so the bot can't push there after the fact.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  ENTRIES_PATH: apps/web/src/app/changelog/entries.json
  # sed -nE program printing the quoted text of each entry flag, and nothing else.
  FLAG: 's/^changelog:[[:space:]]*"(.*[^[:space:]].*)"[[:space:]]*$/\1/p'

jobs:
  check:
    name: Changelog flag
    # Dependabot can't write flags; a skipped job still satisfies a required check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Two pushes in quick succession would otherwise race to commit entries.json.
    concurrency:
      group: changelog-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          msgs=$(git log --format=%B "$base..HEAD")
          text=$(sed -nE "$FLAG" <<< "$msgs" | paste -sd' ')

          if [ -n "$text" ]; then
            echo "Entry: $text"
            # Rebuilt from the base's file every run, so a reworded flag replaces the entry
            # rather than stacking a second one. The bot's own commit carries no flag.
            # Dated in Sydney time; a UTC date would be a day early for morning pushes.
            git show "$base:$ENTRIES_PATH" \
              | jq --arg date "$(TZ=Australia/Sydney date +%F)" --arg text "$text" \
                  '[{date: $date, text: $text}] + .' > "$ENTRIES_PATH"
            # Same text already committed (possibly on an earlier date) — leave it alone.
            if git show "HEAD:$ENTRIES_PATH" | jq -e --arg text "$text" '.[0].text == $text' > /dev/null; then
              echo "Entry already on branch."; exit 0
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(changelog): add entry"
            git push
          elif grep -qE '^no-changelog[[:space:]]*$' <<< "$msgs"; then
            echo "no-changelog"
          elif git diff --name-only "$base" HEAD | grep -qxF "$ENTRIES_PATH"; then
            echo "entries.json edited directly"
          else
            echo "::error::No changelog flag. Add a line to a commit message in this PR — 'changelog: \"<sentence for users>\"' or 'no-changelog' — or edit $ENTRIES_PATH."
            exit 1
          fi
