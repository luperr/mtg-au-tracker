services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: mtg_tracker
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg_tracker"]
      interval: 5s
      retries: 5

  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: sh -c "pnpm --filter @mtg-au/scraper start"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET}
      EBAY_ENV: ${EBAY_ENV:-production}
      EBAY_PAGES_PER_SET: ${EBAY_PAGES_PER_SET:-5}
      EBAY_PAGES_PER_CARD: ${EBAY_PAGES_PER_CARD:-1}
      EBAY_RECENT_MONTHS: ${EBAY_RECENT_MONTHS:-12}
      EBAY_HIGH_VALUE_USD: ${EBAY_HIGH_VALUE_USD:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: sh -c "pnpm install && pnpm --filter @mtg-au/web dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://mtg:${DB_PASSWORD}@db:5432/mtg_tracker
      NODE_ENV: development
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy

volumes:
  node_modules:
  pgdata:
